{% extends "base.html" %}

{% block title %}Edit expense — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit expense</h1>
            <p class="auth-subtitle">Update the details of this expense</p>
        </div>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('edit_expense', id=expense['id']) }}">
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" name="amount"
                       class="form-input" step="0.01" min="0.01"
                       value="{{ expense['amount'] }}" required autofocus>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-input" required>
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if cat == expense['category'] %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date"
                       class="form-input" value="{{ expense['date'] }}" required>
            </div>
            <div class="form-group">
                <label for="description">Description (optional)</label>
                <input type="text" id="description" name="description"
                       class="form-input" value="{{ expense['description'] or '' }}"
                       placeholder="e.g. Groceries at local market">
            </div>
            <button type="submit" class="btn-submit">Save changes</button>
        </form>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Back to profile</a>
        </p>

    </div>
</section>

{% endblock %}
